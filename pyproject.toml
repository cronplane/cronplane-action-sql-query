[project]
name = "sql-query"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cronplane-actions>=0.1,<1",
    "psycopg[binary]>=3.3,<4",
    "ruamel-yaml>=0.18,<0.20",
    "sqlalchemy>=2.1,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.report]
# The coverage measured; it never goes down.
fail_under = 90
omit = ["tests/*"]
